<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>aria2c Downloader</title>
<style>
*{box-sizing:border-box}body{width:340px;margin:0;padding:18px;background:#0c1324;color:#edf2ff;font:14px system-ui}
h1{font-size:20px;margin:0 0 6px}p{color:#9eabc6;margin:0 0 16px;line-height:1.45}
label{display:block;font-weight:650;margin:12px 0 6px}
input[type=url],input[type=text]{width:100%;padding:11px;border:1px solid #344361;border-radius:9px;background:#111d34;color:white;font:13px system-ui}
button{width:100%;padding:11px;margin-top:12px;border:0;border-radius:9px;background:#78a6ff;color:#081225;font-weight:750;cursor:pointer}
button.secondary{background:#263652;color:#eaf0ff}.toggle{display:flex;align-items:center;gap:9px;margin-top:15px;color:#c8d4e9}
#status{min-height:34px;margin-top:10px;color:#a9e8bb;font-size:12px;line-height:1.4}small{color:#91a0bc}
</style></head>
<body>
<h1>aria2c Downloader</h1><p>16 connections · 16 splits · resume enabled</p>
<label for="url">Download URL</label><input id="url" type="url" placeholder="https://example.com/file.zip">
<label for="dir">Save folder (optional)</label><input id="dir" type="text" placeholder="Default aria2 download folder">
<button id="download">Download with aria2c</button><button class="secondary" id="current">Use current tab URL</button>
<label class="toggle"><input id="auto" type="checkbox"> Automatically send Firefox downloads to aria2c</label>
<div id="status" role="status"></div><small>Requires aria2c and the Windows native host.</small>
<script src="popup.js"></script></body></html>
